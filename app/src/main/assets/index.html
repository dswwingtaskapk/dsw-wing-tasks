    await addDoc(collection(db, "users", user.uid, "categories"), { name, color: $("#newPCatColor").value });
  }
  else if (act === "renamepcat") {
    const c = myCats.find(x => x.id === id); const name = await uiPrompt("Rename category", c.name);
    if (name && name.trim()) await updateDoc(doc(db, "users", user.uid, "categories", id), { name: name.trim() });
  }
  else if (act === "delpcat") {
    if (await uiConfirm("Delete this category? Tasks already using it will keep showing its name.", "Delete", true)) await deleteDoc(doc(db, "users", user.uid, "categories", id));
  }
  else if (act === "chpass") {
    const cur = $("#curPass").value, np = $("#newPass").value, np2 = $("#newPass2").value;
    if (!cur || !np) { toast("Please fill in all the password fields."); return; }
    if (np.length < 6) { toast("The new password must be at least 6 characters."); return; }
    if (np !== np2) { toast("The two new passwords do not match."); return; }
    try {
      await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, cur));
      await updatePassword(user, np);
      ["#curPass","#newPass","#newPass2"].forEach(x => $(x).value = "");
      toast("Password changed successfully.");
    } catch (e) {
      toast(["auth/invalid-credential","auth/wrong-password"].includes(e.code) ? "Your current password is wrong." : "Could not change the password: " + (e.code || e.message));
    }
  }
  else if (act === "pushcheck") { await runPushCheck(); }
  else if (act === "updgo") window.open(apkUrl(), "_blank");
  else if (act === "theme") { try { localStorage.setItem("wt_theme", v); } catch (e) {} applyTheme(); render(); }
  else if (act === "sharelink") shareLink();

  else if (act === "pushurlsave") {

  else if (act === "logout") {

    Object.keys(DR_TPL).forEach(k => { clean[k] = typeof DR_TPL[k] === "number" ? Math.max(0, Math.min(20, Number(T[k]) || 0)) : String(T[k]); });
    await setDoc(doc(db, "config", "dailyReport"), { template: clean, templateBy: myName(), templateAt: Date.now() }, { merge: true });
    drConfig = { ...drConfig, template: clean }; drTplDraft = null; toast("Report format saved");
  }
  else if (act === "drtplreset") {
    if (!(await uiConfirm("Reset the report format to the original wording?", "Reset"))) return;
    await setDoc(doc(db, "config", "dailyReport"), { template: null }, { merge: true });
    drConfig = { ...drConfig, template: null }; drTplDraft = null; toast("Format reset");
  }
  else if (act === "drprev") { drEditText = false; drSubscribed = shiftDate(drDate, -1); drSubscribe(drSubscribed); }
  else if (act === "drnext") { drEditText = false; drSubscribed = shiftDate(drDate, 1); drSubscribe(drSubscribed); }
  else if (act === "drtoday") { drSubscribed = dhakaDateStr(); drSubscribe(drSubscribed); }
  else if (act === "dractadd") {
    const sec = el.dataset.sec; const inp = $("#dr_new_" + sec); const text = inp.value.trim(); if (!text) return;
    const d = drEdit(sec); d.items = d.items || []; d.items.push({ text }); inp.value = ""; render();
  }
  else if (act === "dractdel") { const sec = el.dataset.sec; const d = drEdit(sec); d.items.splice(+el.dataset.i, 1); render(); }
  else if (act === "dractmove") {
    const sec = el.dataset.sec; const d = drEdit(sec); const i = +el.dataset.i, j = i + +el.dataset.dir;
    if (j < 0 || j >= d.items.length) return;
    [d.items[i], d.items[j]] = [d.items[j], d.items[i]]; render();
  }
  else if (act === "drsave") {
    const sec = el.dataset.sec; const d = drDraftFor(sec);
    const prevStatus = drStatus(drReport, drSections);

    await setDoc(doc(db, "dailyReports", drDate, "sections", sec), { ...d, updatedBy: myName(), updatedByEmail: me, updatedAt: Date.now() });
    drResetDraft(sec);

    }

$("#view").addEventListener("input", e => {
  if (e.target.id === "q") { searchQ = e.target.value; $("#taskList").innerHTML = taskListHtml(); return; }
  if (e.target.dataset.tpl) {
    const T = drTplDraftGet(), k = e.target.dataset.tpl;
    T[k] = typeof DR_TPL[k] === "number" ? Number(e.target.value) || 0 : e.target.value;
    const pv = $("#tplPreview"); if (pv) pv.textContent = drCompile(drDate, drSections, T);
    return;
  }
  if (e.target.dataset.cfgparts) { const d = drCfgDraftGet(); d[e.target.dataset.cfgparts][+e.target.dataset.i] = Math.max(0, Math.floor(Number(e.target.value) || 0)); d.dirty = true; return; }
  if (e.target.id === "drCfgDeadline") { const d = drCfgDraftGet(); d.deadline = e.target.value; d.dirty = true; return; }
  if (e.target.id === "drCfgReminders") { const d = drCfgDraftGet(); d.remindersOn = e.target.checked; d.dirty = true; return; }
  const sec = e.target.dataset.drsec;
  if (sec && e.target.dataset.drpart !== undefined) {
    const parts = sec === "maleWing" ? drConfig.maleParts : sec === "femaleWing" ? drConfig.femaleParts : drConfig.hostelParts;
    const d = drEdit(sec), pp = drPresentParts(d, parts);
    pp[+e.target.dataset.drpart] = Number(e.target.value) || 0;
    d.presentParts = pp; d.present = pp.reduce((a, b) => a + b, 0);
    const pt = $("#drpt_" + sec), ol = $("#drol_" + sec);
    if (pt) pt.textContent = d.present;
    if (ol) ol.textContent = wingOnLeave(d, parts);
    return;
  }
  if (sec) {
    const d = drEdit(sec);
    const f = e.target.dataset.drfield;
    if (e.target.dataset.dridx !== undefined) {
      const i = +e.target.dataset.dridx; d.students = d.students || []; d.students[i] = d.students[i] || {};
      d.students[i][f] = e.target.value;
    } else d[f] = e.target.value;
    if (f === "yetToJoin" || f === "total") {
      const parts = sec === "maleWing" ? drConfig.maleParts : sec === "femaleWing" ? drConfig.femaleParts : drConfig.hostelParts;
      const ol = $("#drol_" + sec); if (ol) ol.textContent = wingOnLeave(d, parts);
    }
  }
});
$("#view").addEventListener("change", e => run(async () => {
  if (e.target.dataset.tf) { const k = e.target.dataset.tf; tf[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value; render(); return; }
  if (e.target.dataset.rep) {
    const k = e.target.dataset.rep; rep[k] = e.target.value;
    if (k === "scope") { rep.person = "all"; rep.cat = "all"; }
    if (k === "period" && e.target.value === "custom" && !rep.from) {
      const d = new Date(); rep.to = toDateInput(d); d.setDate(d.getDate() - 29); rep.from = toDateInput(d);
    }
    render(); return;
  }
  if (e.target.dataset.set) {
    const k = e.target.dataset.set;
    await saveSetting(k, k === "leadHours" ? Number(e.target.value) : e.target.value);
    return;
  }
  if (e.target.dataset.act === "precolor")
    await updateDoc(doc(db, "users", user.uid, "categories", e.target.dataset.id), { color: e.target.value });
  if (e.target.dataset.act === "recolor")
    await updateDoc(doc(db, "categories", e.target.dataset.id), { color: e.target.value });
  if (e.target.dataset.drmode) {
    const sec = e.target.dataset.drmode, d = drEdit(sec), n = Number(e.target.value) || 0;
    d.mode = n; d.students = d.students || []; while (d.students.length < n) d.students.push({}); d.students.length = n;
    render();
  }
}));
