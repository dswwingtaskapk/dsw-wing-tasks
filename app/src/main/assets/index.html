function donutSvg(cnt, n) {
  const R = 52, C = 2 * Math.PI * R; let off = 0;
  const arcs = ["done", "doing", "pending", "overdue"].map(k => {
    const len = n ? cnt[k] / n * C : 0;
    const a = len > 0 ? `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${RC[k]}" stroke-width="18" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>` : "";
    off += len; return a;
  }).join("");
  return `<svg viewBox="0 0 140 140" width="140" height="140"><circle cx="70" cy="70" r="${R}" fill="none" stroke="#eef0f8" stroke-width="18"/>${arcs}<text x="70" y="68" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2140">${pct(cnt.done, n)}%</text><text x="70" y="86" text-anchor="middle" font-size="9.5" fill="#7a82a8">completed</text></svg>`;
}
function trendSvg(bk, a, b) {
  const W = 680, H = 200, L = 30, Bm = 26, Tp = 12, ph = H - Bm - Tp, pw = W - L - 8;
  const mx = Math.max(1, ...a, ...b), step = Math.ceil(mx / 4), top = step * 4;
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const y = Tp + ph - ph * i / 4;
    g += `<line x1="${L}" x2="${W - 8}" y1="${y}" y2="${y}" stroke="#eef0f8"/><text x="${L - 6}" y="${y + 3}" text-anchor="end" font-size="9" fill="#7a82a8">${step * i}</text>`;
  }
  const gw = pw / bk.length, bw = Math.min(16, gw * 0.34), every = Math.ceil(bk.length / 12);
  let bars = "";
  bk.forEach((k, i) => {
    const cx = L + gw * i + gw / 2, h1 = ph * a[i] / top, h2 = ph * b[i] / top;
    bars += `<rect x="${cx - bw - 1}" y="${Tp + ph - h1}" width="${bw}" height="${h1}" rx="2" fill="${RC.acc}"/><rect x="${cx + 1}" y="${Tp + ph - h2}" width="${bw}" height="${h2}" rx="2" fill="${RC.done}"/>`;
    if (i % every === 0) bars += `<text x="${cx}" y="${H - 9}" text-anchor="middle" font-size="9" fill="#7a82a8">${esc(k.l)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}${bars}</svg>`;
}

function buildReport() {
  const r = repRange();
  if (!r) return "";
  const [from, to] = r, NOW = Date.now();
  const keyDate = t => rep.basis === "due" ? t.deadline : (t.givenAt || t.createdAt);
  let list = repBase().filter(t => { const k = keyDate(t); return k && k >= from && k <= to; });
  if (rep.person !== "all" && rep.scope !== "mine") list = list.filter(t => t.assigneeEmail === rep.person);
  if (rep.cat !== "all") list = list.filter(t => catNameOf(t) === rep.cat);
  const stOf = t => t.status === "done" ? "done" : (t.deadline && t.deadline < NOW ? "overdue" : (t.status === "doing" ? "doing" : "pending"));
  const n = list.length;
  const cnt = { done: 0, doing: 0, pending: 0, overdue: 0 };
  list.forEach(t => cnt[stOf(t)]++);
  const doneL = list.filter(t => t.status === "done");
  const withDl = doneL.filter(t => t.deadline && t.doneAt);
  const onTime = withDl.filter(t => t.doneAt <= t.deadline).length;
  const durOf = t => t.doneAt ? t.doneAt - (t.givenAt || t.createdAt || t.doneAt) : 0;
  const durs = doneL.map(durOf).filter(x => x > 0);
  const avg = durs.length ? durs.reduce((x, y) => x + y, 0) / durs.length : 0;
  const urgent = list.filter(t => t.urgent), urgentDone = urgent.filter(t => t.status === "done").length;

  const pm = new Map();
  list.forEach(t => {
    const k = t.assigneeEmail;
    if (!pm.has(k)) pm.set(k, { name: t.assigneeName || nameOf(k), total: 0, done: 0, overdue: 0, durs: [] });
    const p = pm.get(k); p.total++;
    const s = stOf(t);
    if (s === "done") { p.done++; const d = durOf(t); if (d > 0) p.durs.push(d); }
    if (s === "overdue") p.overdue++;
  });
  const people = [...pm.values()].sort((a, b) => b.total - a.total);
  const cm = new Map();
  list.forEach(t => {
    const k = catNameOf(t);
    if (!cm.has(k)) cm.set(k, { name: k, total: 0, done: 0 });
    const c = cm.get(k); c.total++; if (t.status === "done") c.done++;
  });
  const catsR = [...cm.values()].sort((a, b) => b.total - a.total).slice(0, 8);

  const bk = repBuckets(from, to);
  const ga = bk.map(() => 0), gb = bk.map(() => 0);
  const bi = ms => bk.findIndex(b => ms >= b.s && ms <= b.e);
  list.forEach(t => {
    let i = bi(keyDate(t)); if (i >= 0) ga[i]++;
    if (t.status === "done" && t.doneAt) { i = bi(t.doneAt); if (i >= 0) gb[i]++; }
  });
  const aLabel = rep.basis === "due" ? "Due" : "Assigned";

  /* quick summary */
  const sum = [];
  if (n) {
    sum.push(`<b>${n}</b> task${n > 1 ? "s were" : " was"} ${rep.basis === "due" ? "due" : "assigned"} in this period; <b>${cnt.done}</b> (${pct(cnt.done, n)}%) completed.`);
    sum.push(`<b>${cnt.doing}</b> in progress, <b>${cnt.pending}</b> not started, and <b style="color:${RC.overdue}">${cnt.overdue}</b> overdue (${pct(cnt.overdue, n)}% of all tasks).`);
    if (withDl.length) sum.push(`<b>${pct(onTime, withDl.length)}%</b> on-time delivery: ${onTime} of ${withDl.length} completed tasks with a deadline were finished before it.`);
    if (durs.length) sum.push(`Average completion time is <b>${durFmt(avg)}</b> from the date a task was assigned.`);
    if (urgent.length) sum.push(`<b>${urgent.length}</b> urgent task${urgent.length > 1 ? "s" : ""}, of which ${urgentDone} completed.`);
    if (rep.scope !== "mine" && people.length > 1) {
      const top = [...people].sort((a, b) => b.done - a.done || pct(b.done, b.total) - pct(a.done, a.total))[0];
      if (top.done) sum.push(`Most completed: <b>${esc(top.name)}</b> (${top.done} of ${top.total}).`);
      const worst = [...people].sort((a, b) => b.overdue - a.overdue)[0];
      if (worst.overdue) sum.push(`Needs attention: <b>${esc(worst.name)}</b> has ${worst.overdue} overdue task${worst.overdue > 1 ? "s" : ""}.`);
    }
    if (catsR.length > 1) sum.push(`Busiest category: <b>${esc(catsR[0].name)}</b> (${catsR[0].total} tasks, ${pct(catsR[0].total, n)}%).`);
  }

  const meta = (l, v) => `<div><span>${l}</span>${v}</div>`;
  const personTxt = rep.scope === "mine" ? esc(myName()) : (rep.person === "all" ? "Everyone" : esc(nameOf(rep.person)));
  const head = `<div class="rsec rhead"><h1>Task Performance Report</h1><div class="rsub">Wing Tasks - DSW Wing</div>
    <div class="rmeta">
      ${meta("Period", `${fmtDay(from)} – ${fmtDay(to)}`)}
      ${meta("Scope", esc(repScopes().concat([["wing", ""]]).find(x => x[0] === rep.scope)[1]))}
      ${meta("Tasks counted by", rep.basis === "due" ? "Deadline date" : "Assigned date")}
      ${meta("Team member", personTxt)}
      ${meta("Category", rep.cat === "all" ? "All categories" : esc(rep.cat))}
      ${meta("Generated", `${esc(myName())} · ${fmtDay(Date.now())}`)}
    </div></div>`;
  if (!n) return head + `<div class="rsec"><div style="text-align:center;padding:24px 0;color:#7a82a8">No tasks found for the selected period and filters.</div></div>`;

  const kpi = (v, l, sub, col) => `<div class="kpi"><b ${col ? `style="color:${col}"` : ""}>${v}</b><span>${l}</span>${sub ? `<br><em ${col ? `style="color:${col}"` : ""}>${sub}</em>` : ""}</div>`;
  const kpis = `<div class="rsec"><h3>Overview</h3><div class="kpis">
      ${kpi(n, "Total tasks")}
      ${kpi(cnt.done, "Completed", pct(cnt.done, n) + "%", RC.done)}
      ${kpi(cnt.doing + cnt.pending, "Open (not overdue)", pct(cnt.doing + cnt.pending, n) + "%", RC.acc)}
      ${kpi(cnt.overdue, "Overdue", pct(cnt.overdue, n) + "%", RC.overdue)}
      ${kpi(withDl.length ? pct(onTime, withDl.length) + "%" : "—", "On-time rate", withDl.length ? `${onTime}/${withDl.length} tasks` : "no data")}
      ${kpi(durs.length ? durFmt(avg) : "—", "Avg completion time")}
    </div>
    <h3 style="margin-top:16px">Quick summary</h3><ul class="sum">${sum.map(s => `<li>${s}</li>`).join("")}</ul></div>`;

  const legend = ["done", "doing", "pending", "overdue"].map(k => `<div><i style="background:${RC[k]}"></i>${RLABEL[k]}<b>${cnt[k]} · ${pct(cnt[k], n)}%</b></div>`).join("");
  const charts = `<div class="rsec"><h3>Status breakdown</h3><div class="dwrap">${donutSvg(cnt, n)}<div class="leg">${legend}</div></div></div>
    <div class="rsec"><h3>Activity over time</h3>${trendSvg(bk, ga, gb)}
      <div class="rfoot" style="margin-top:4px"><span style="color:${RC.acc}">■</span> ${aLabel} &nbsp; <span style="color:${RC.done}">■</span> Completed</div></div>`;

  const catSec = catsR.length ? `<div class="rsec"><h3>By category</h3>${catsR.map(c => `<div class="crow2"><div class="ctop"><span>${esc(c.name)}</span><span><b>${c.done}/${c.total}</b> · ${pct(c.done, c.total)}% done</span></div><div class="track"><i style="width:${pct(c.done, c.total)}%"></i></div></div>`).join("")}</div>` : "";

  let teamSecs = "";
  if (rep.scope !== "mine" && people.length) {
    const rows = people.map(p => `<tr><td><b>${esc(p.name)}</b></td><td>${p.total}</td><td>${p.done}</td><td style="color:${p.overdue ? RC.overdue : "inherit"}">${p.overdue}</td>
      <td style="min-width:110px"><div class="track"><i style="width:${pct(p.done, p.total)}%"></i></div><span class="rfoot">${pct(p.done, p.total)}%</span></td>
      <td>${p.durs.length ? durFmt(p.durs.reduce((x, y) => x + y, 0) / p.durs.length) : "—"}</td></tr>`);
    for (let i = 0; i < rows.length; i += 14)
      teamSecs += `<div class="rsec">${i === 0 ? "<h3>Team performance</h3>" : ""}<div class="tablewrap"><table><tr><th>Member</th><th>Assigned</th><th>Done</th><th>Overdue</th><th>Completion</th><th>Avg time</th></tr>${rows.slice(i, i + 14).join("")}</table></div></div>`;
  }

  const sorted = [...list].sort((a, b) => (keyDate(a) || 0) - (keyDate(b) || 0));
  const colName = rep.scope === "mine" ? "From" : "Assignee";
  const trs = sorted.map((t, i) => {
    const s = stOf(t);
    const who = rep.scope === "mine" ? (isSelfTask(t) ? "Myself" : (t.creatorName || nameOf(t.creatorEmail))) : (t.assigneeName || nameOf(t.assigneeEmail));
    const cat = catNameOf(t) + (t.customCategory && (catInfo(t) || {}).name ? ` · ${t.customCategory}` : "");
    return `<tr><td>${i + 1}</td><td><b>${esc(t.title)}</b></td><td>${esc(who)}</td><td>${esc(cat)}</td><td>${t.givenAt || t.createdAt ? fmtDay(t.givenAt || t.createdAt) : "—"}</td><td>${t.deadline ? fmtDay(t.deadline) : "—"}</td>
      <td><span class="rb" style="background:${tint(RC[s])};color:${RC[s]}">${RLABEL[s]}</span></td><td>${t.status === "done" && t.doneAt ? fmtDay(t.doneAt) : "—"}</td></tr>`;
  });
  let listSecs = "";
  for (let i = 0; i < trs.length; i += 12)
    listSecs += `<div class="rsec">${i === 0 ? `<h3>Task details (${n})</h3>` : ""}<div class="tablewrap"><table><tr><th>#</th><th>Task</th><th>${colName}</th><th>Category</th><th>Assigned</th><th>Deadline</th><th>Status</th><th>Done on</th></tr>${trs.slice(i, i + 12).join("")}</table></div></div>`;
  const foot = `<div class="rsec rfoot" style="text-align:center">Generated by Wing Tasks - DSW Wing</div>`;
  return head + kpis + charts + catSec + teamSecs + listSecs + foot;
}

function loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) return res();
    const s = document.createElement("script"); s.src = src; s.onload = res;
    s.onerror = () => rej(new Error("Could not load the PDF library. Please check your internet connection and try again."));
    document.head.appendChild(s);
  });
}
async function downloadPdf() {
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  const host = document.createElement("div");
  host.style.cssText = "position:fixed;left:-10000px;top:0;width:760px;";
  host.innerHTML = `<div class="paper pdf">${repHtml}</div>`;
  document.body.appendChild(host);
  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: "mm", format: "a4" });
    const W = 210, H = 297, FOOT = 10;
    let y = 0;
    for (const el of host.querySelectorAll(".rsec")) {
      const cv = await window.html2canvas(el, { scale: 2, backgroundColor: "#ffffff", useCORS: true });
      let w = W, h = cv.height * W / cv.width;
      if (h > H - FOOT) { w = W * (H - FOOT) / h; h = H - FOOT; }
      if (y > 0 && y + h > H - FOOT) { pdf.addPage(); y = 0; }
      pdf.addImage(cv.toDataURL("image/jpeg", 0.92), "JPEG", (W - w) / 2, y, w, h);
      y += h;
    }
    const pages = pdf.getNumberOfPages();
    for (let i = 1; i <= pages; i++) {
      pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(150);
      pdf.text(`Wing Tasks - DSW Wing  |  Page ${i} of ${pages}`, W / 2, H - 5, { align: "center" });
    }
    pdf.save(`WingTasks-Report-${toDateInput(new Date())}.pdf`);
  } finally { host.remove(); }
}

async function drLoadHistory() {
  drHist = null; render();
  const snap = await getDocs(collection(db, "dailyReports"));
  let rows = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.id.localeCompare(a.id));
  if (drHistFrom) rows = rows.filter(r => r.id >= drHistFrom);
  if (drHistTo) rows = rows.filter(r => r.id <= drHistTo);
  if (drHistQ.trim()) { const q = drHistQ.trim().toLowerCase(); rows = rows.filter(r => (r.finalized ? "finalized" : "in progress").includes(q) || r.id.includes(q)); }
  drHist = rows.slice(0, 120); render();
}
async function drDeleteReport(dateStr) {
  if (!(await uiConfirm(`Delete the Daily Report for ${fmtReportDate(dateStr)}? This cannot be undone.`, "Delete", true))) return;
  await run(async () => {
    const secs = await getDocs(collection(db, "dailyReports", dateStr, "sections"));
    for (const s of secs.docs) await deleteDoc(doc(db, "dailyReports", dateStr, "sections", s.id));
    await deleteDoc(doc(db, "dailyReports", dateStr));
  });

function openSheet(task, opts = {}) {
  const t = task || {};

  let sheetSteps = (t.steps || []).map(s => ({ ...s }));
  const c = catInfo(t);
  const assignOpts = (() => {

    if (isEdit && !set.some(o => o.email === t.assigneeEmail)) set.push({ email: t.assigneeEmail, name: t.assigneeName || t.assigneeEmail });

  })();

  const infoBlock = `<div class="info">

      <div class="meta">
        ${c ? `<span class="chip cat" style="--c:${esc(c.color)}">${esc(c.name)}</span>` : ""}

        ${t.urgent ? `<span class="chip bad">Urgent</span>` : ""}

      <div class="meta">${t.givenAt ? `Given: ${fmtDate(t.givenAt)}` : ""} ${t.deadline ? ` · Deadline: <b>${fmtDate(t.deadline)}</b>` : ""}</div>

    </div>`;
  const timeline = isEdit ? `<div class="row" style="margin-top:14px"><button type="button" class="btn ghost" id="sChat">Open chat${(t.updates || []).filter(isMsg).length ? " (" + (t.updates || []).filter(isMsg).length + ")" : ""}</button>${full && t.deadline && t.status !== "done" ? `<button type="button" class="btn ghost" id="sGcal2">Add to Calendar</button>` : ""}</div>` : "";

  $("#sheetHost").innerHTML = `<div class="overlay" id="ov"><div class="sheet">

        (isEdit && t.assigneeEmail !== me ? `<label>Assigned to</label><div class="info" style="padding:10px">${esc(t.assigneeName || nameOf(t.assigneeEmail))}</div>` : "")}
      <label>Details</label><textarea id="fDetails" rows="2">${esc(t.details||"")}</textarea>
      <div id="catSelf" class="${selfT?"":"hidden"}"><label>Category (your personal categories)</label>
        <select id="fCatSelf"><option value="">None</option>
          ${myCats.map(c=>`<option value="${c.id}" ${selfT&&t.categoryId===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}
          <option value="__new__">Add new category…</option></select>
        <input id="fNewCat" class="hidden" placeholder="New category name" style="margin-top:6px"></div>

          ${cats.map(c=>`<option value="${c.id}" ${!selfT&&t.categoryId===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select>
        <label>Custom label (optional)</label>
        <input id="fCustom" placeholder="Write anything, e.g. Hall inspection" value="${esc(t.customCategory||"")}"></div>
      <label>Type</label><select id="fType">
          ${TYPES.map(x=>`<option ${t.type===x?"selected":""}>${x}</option>`).join("")}</select>
      <div id="giverBox" class="${defAssign!==me?"hidden":""}"><label>Given by (if someone gave you this task)</label>
        <input id="fGiver" list="giverList" placeholder="Pick a member or type a name" value="${esc(t.giverName||"")}">
        <datalist id="giverList">${members.filter(m=>m.email!==me && m.active!==false).map(m=>`<option value="${esc(m.name)}">`).join("")}</datalist>
        <div class="muted" style="font-size:11.5px;margin-top:4px">If that person is a member of this app, the task will also appear in their Assigned tab for tracking.</div></div>
      <div class="grid2">
        <div><label>Given at</label><input type="datetime-local" id="fGiven" value="${toLocalInput(t.givenAt || Date.now())}"></div>
        <div><label>Deadline</label><input type="datetime-local" id="fDue" value="${toLocalInput(t.deadline)}"></div>

      <div id="repBox" class="${defAssign!==me?"hidden":""}"><label>Repeat</label>
      <select id="fRepeat">${[["none","Does not repeat"],["daily","Every day"],["weekly","Every week"],["monthly","Every month"]]
        .map(([k,l]) => `<option value="${k}" ${(t.repeat||"none")===k?"selected":""}>${l}</option>`).join("")}</select></div>
      ` : infoBlock + `<div id="moreBox" style="margin-top:0">`}
      ${isEdit?`<label>Status</label><select id="fStatus">
        ${Object.entries(STATUS).map(([k,l]) => `<option value="${k}" ${t.status===k?"selected":""}>${l}</option>`).join("")}</select>`:""}
      <label>Steps (break a big task into small parts)</label>

  $("#sChat")?.addEventListener("click", () => openChat(t.id));
  const drawSteps = () => {

  });
  $("#stepList").addEventListener("change", e => {
    if (e.target.dataset.si !== undefined) sheetSteps[+e.target.dataset.si].done = e.target.checked;
  });
  $("#moreBtn")?.addEventListener("click", () => { $("#moreBox").classList.remove("hidden"); $("#moreBtn").classList.add("hidden"); });
  $("#fAssign")?.addEventListener("change", e => {
    const self = e.target.value === me;
    $("#giverBox").classList.toggle("hidden", !self); $("#repBox").classList.toggle("hidden", !self);
    $("#catSelf").classList.toggle("hidden", !self); $("#catOther").classList.toggle("hidden", self);
  });
  $("#fCatSelf")?.addEventListener("change", e => $("#fNewCat").classList.toggle("hidden", e.target.value !== "__new__"));
  $("#sDel")?.addEventListener("click", async () => {
    if (await uiConfirm("Delete this task?", "Delete", true)) { await run(async () => { await deleteTaskFiles(t); await deleteDoc(doc(db, "tasks", t.id)); }); toast("Task deleted"); close(); }
  });
  // assignee opened a brand-new assignment -> mark as seen
  if (isEdit && isNewForMe(t)) run(() => updateDoc(doc(db, "tasks", t.id), { seenByAssignee: true }));

  $("#sSave").onclick = () => run(async () => {
    const stamp = text => ({ text, by: myName(), byEmail: me, at: Date.now() });
    const log = [];
    const noteEl = $("#fNote"); const note = noteEl ? noteEl.value.trim() : "";
    if (note) log.push(stamp(note));
    let data = {};
    if (full) {
      const title = $("#fTitle").value.trim();
      if (!title) { $("#fTitle").focus(); return; }
      data.title = title;
      const more = !$("#moreBox").classList.contains("hidden");
      if (more) {
        const target = $("#fAssign") ? $("#fAssign").value : (isEdit ? t.assigneeEmail : me);
        Object.assign(data, {

          givenAt: fromLocalInput($("#fGiven").value) || Date.now(), deadline: fromLocalInput($("#fDue").value),

          } else ci = myCats.find(x => x.id === v) || null;
          Object.assign(data, { categoryId: ci ? ci.id : "", categoryName: ci ? ci.name : "", categoryColor: ci ? ci.color : "", customCategory: "" });

          Object.assign(data, { categoryId: ci ? ci.id : "", categoryName: ci ? ci.name : "", categoryColor: ci ? ci.color : "", customCategory: $("#fCustom").value.trim() });
        }
        if (target === me || (isEdit && t.assigneeEmail === me)) data.repeat = $("#fRepeat").value;
        if (target === me) {
          const gv = ($("#fGiver").value || "").trim();
          const gm = members.find(m => m.email !== me && (m.name.toLowerCase() === gv.toLowerCase() || m.email === gv.toLowerCase()));

        }
        if (isEdit ? (isAdmin && target !== t.assigneeEmail) : true) {
          data.assigneeEmail = target; data.assigneeName = target === me ? myName() : nameOf(target);
        }
      }
    }
    if (isEdit || (full && !$("#moreBox").classList.contains("hidden")) || sheetSteps.length) {
      const pend = $("#fStepNew") ? $("#fStepNew").value.trim() : "";
      if (pend && full) sheetSteps.push({ text: pend, done: false });
      data.steps = sheetSteps;
      const chosen = isEdit ? $("#fStatus").value : "todo";
      data.status = statusFromSteps(sheetSteps, chosen);
      data.doneAt = data.status === "done" ? (t.doneAt || Date.now()) : null;
      if (isEdit && data.status !== t.status) log.push(stamp(`Status: ${STATUS[t.status] || "Pending"} → ${STATUS[data.status]}`));
    }
    if (isEdit) {
      const upd = { ...data };
      if (log.length) upd.updates = arrayUnion(...log);
      await updateDoc(doc(db, "tasks", t.id), upd);
      if (data.status === "done" && t.status !== "done") await spawnNext({ ...t, ...data });
    } else {
      const target = data.assigneeEmail || me;
      const assigned = target !== me;
      const base = { details:"", categoryId:"", categoryName:"", categoryColor:"", customCategory:"", type:"Task", giverName:"", giverEmail:"", givenAt:Date.now(), deadline:null,
        urgent:false, status:"todo", steps:[], repeat:"none", createdAt:Date.now(), ...data,
        assigneeEmail: target, assigneeName: assigned ? nameOf(target) : myName(),
        creatorEmail: me, creatorName: myName(), seenByAssignee: !assigned,
        updates: assigned ? [stamp(`Task assigned to ${nameOf(target)}`), ...log] : log };

        return;
      } finally { deleteApp(sec).catch(() => {}); }
    }
    await setDoc(doc(db, "members", email), data, { merge: true });
    toast("Member saved");
    close();
  });
}

      const i = +e.target.dataset.dridx; d.students = d.students || []; d.students[i] = d.students[i] || {};
      d.students[i][f] = e.target.value;
    } else d[f] = e.target.value;
    if (f === "yetToJoin" || f === "total") {
      const parts = sec === "maleWing" ? drConfig.maleParts : sec === "femaleWing" ? drConfig.femaleParts : drConfig.hostelParts;
      const ol = $("#drol_" + sec); if (ol) ol.textContent = wingOnLeave(d, parts);
    }
  }
});
$("#view").addEventListener("change", e => run(async () => {
  if (e.target.dataset.rep) {
    const k = e.target.dataset.rep; rep[k] = e.target.value;
    if (k === "scope") { rep.person = "all"; rep.cat = "all"; }
    if (k === "period" && e.target.value === "custom" && !rep.from) {
      const d = new Date(); rep.to = toDateInput(d); d.setDate(d.getDate() - 29); rep.from = toDateInput(d);
    }
    render(); return;
  }
  if (e.target.dataset.set) {
    const k = e.target.dataset.set;
    await saveSetting(k, k === "leadHours" ? Number(e.target.value) : e.target.value);
    return;
  }
  if (e.target.dataset.act === "precolor")
    await updateDoc(doc(db, "users", user.uid, "categories", e.target.dataset.id), { color: e.target.value });
  if (e.target.dataset.act === "recolor")
    await updateDoc(doc(db, "categories", e.target.dataset.id), { color: e.target.value });
  if (e.target.dataset.drmode) {
    const sec = e.target.dataset.drmode, d = drEdit(sec), n = Number(e.target.value) || 0;
    d.mode = n; d.students = d.students || []; while (d.students.length < n) d.students.push({}); d.students.length = n;
    render();
  }
}));
</script>
</body>
