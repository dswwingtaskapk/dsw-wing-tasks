plugins {
    id 'com.android.application'
}

// GitHub gives every build a number; it becomes the app version (1.1, 1.2, 1.3 ...)
def buildNo = (System.getenv("VERSION_CODE") ?: "1").toInteger()
def ksFile = file(System.getenv("KEYSTORE_FILE") ?: "release.keystore")

android {
    namespace 'com.dswwing.tasks'
    compileSdk 34

    defaultConfig {
        applicationId "com.dswwing.tasks"
        minSdk 24
        targetSdk 34
        versionCode buildNo
        versionName "1." + buildNo
    }
    signingConfigs {
        release {
            // the same key every time, so a new APK installs over the old one (data is kept)
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias "wingtasks"
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}

// Phone push notifications: switched on automatically once app/google-services.json is added
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
